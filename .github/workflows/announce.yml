name: Announce Cronos floor
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: cronos-announcer
  cancel-in-progress: false
jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: main - covenant-floor-cronos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: bot/data
          key: cronos-announcer-${{ github.run_id }}
          restore-keys: |
            cronos-announcer-
      - name: Post settled rounds
        run: node bot/cronos.mjs
        env:
          CRONOS_ONCE: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      - name: Stay awake
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          queued=$(gh run list --workflow=announce.yml --status queued --json databaseId --jq 'length')
          if [ "$queued" = "0" ]; then
            gh workflow run announce.yml --ref main
          fi